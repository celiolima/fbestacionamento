

services:
  mysql:
    image: biarms/mysql:5.7-beta-circleci 
    volumes:
      - volume_db_data_jbjuaz:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: estacionamentojn
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    restart: always
    networks:
      - jbjuaz

  phpmyadmin:
    image: phpmyadmin:latest 
    container_name: phpmyadmin    
    depends_on:
      - mysql
    ports:
      - 9080:80
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    links:
      - mysql
    restart: always 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paineldb.rule=Host(`paineldb.stesistemas.com`) || Host(`www.paineldb.stesistemas.com`)" # Troque pelo seu dominio ou subdominio
      - "traefik.http.routers.paineldb.entrypoints=websecure"
      - "traefik.http.routers.paineldb.tls.certresolver=le"
      - "traefik.http.services.paineldb.loadbalancer.server.port=80"
      - "traefik.http.routers.pma.tls=true"
    networks:
      - jbjuaz

  
  wsnode:
    depends_on:
      - mysql
    build: ./websockt 
    restart: always
    env_file: ./.env  
    volumes:
      # DESENVOLVIMENTO: mapeia código local diretamente
      - ./websockt:/app:cached
      - volume_wsjbjuaz_fotos:/app/public/uploads/car    
    ports:
      - '9090:3001'  
    stdin_open: true
    tty: true
    labels:
      # Rota HTTP para redirecionar para HTTPS
      - "traefik.http.routers.wsnode-http.rule=Host(`wsjuazeiro.stesistemas.com`)"
      - "traefik.http.routers.wsnode-http.service=wsnode-http"
      - "traefik.http.routers.wsnode-http.entrypoints=web"
      - "traefik.http.routers.wsnode-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      # Rota HTTPS normal
      - "traefik.enable=true"
      - "traefik.http.routers.wsnode-https.rule=Host(`wsjuazeiro.stesistemas.com`)" #Coloque o Seu Dominio do wsnode Aqui
      - "traefik.http.routers.wsnode-https.service=wsnode-https"
      - "traefik.http.routers.wsnode-https.entrypoints=websecure"
      - "traefik.http.routers.wsnode-https.tls=true"
      - "traefik.http.routers.wsnode-https.tls.certresolver=le" 
      - "traefik.http.services.wsnode-https.loadbalancer.server.port=3001" 
    networks:
      - jbjuaz


  node:
    depends_on:
      - mysql
      - wsnode
    build: ./app_node
    restart: always
    env_file: ./.env  
    volumes:
      # DESENVOLVIMENTO: mapeia código local diretamente  
      - ./app_node:/app_node:cached
      - volume_wsjbjuaz_fotos:/app_node/public/uploads/car     
    ports:
      - '3000:3000'  
    stdin_open: true
    tty: true
    labels:
      # Rota HTTP para redirecionar para HTTPS
      - "traefik.http.routers.node-http.rule=Host(`app.stesistemas.com`)"
      - "traefik.http.routers.node-http.service=node-http"
      - "traefik.http.routers.node-http.entrypoints=web"
      - "traefik.http.routers.node-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      # Rota HTTPS normal
      - "traefik.enable=true"
      - "traefik.http.routers.node-https.rule=Host(`app.stesistemas.com`)" #Coloque o Seu Dominio do node Aqui
      - "traefik.http.routers.node-https.service=node-https"
      - "traefik.http.routers.node-https.entrypoints=websecure"
      - "traefik.http.routers.node-https.tls=true"
      - "traefik.http.routers.node-https.tls.certresolver=le" 
      - "traefik.http.services.node-https.loadbalancer.server.port=3000" 
    networks:
      - jbjuaz
  
  
  php-app:
    #image: php:7.4-apache
    build:      
      context: ./app_php
      dockerfile: Dockerfile
    container_name: php-app
    depends_on:
      - mysql
      - wsnode
    restart: always
    ports:
      - "8080:80"
    volumes:
      # DESENVOLVIMENTO: mapeia código local diretamente
      - ./app_php:/var/www/html:cached  # cached para melhor performance
      # Opcional: volume separado para uploads se necessário
      # - ./app_php/public/uploads:/var/www/html/public/uploads:delegated
    networks:
      - jbjuaz
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=estacionamento_mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpapp.rule=Host(`fbjuaz.stesistemas.com`)"
      - "traefik.http.routers.phpapp.entrypoints=websecure"
      - "traefik.http.routers.phpapp.tls=true"
      - "traefik.http.routers.phpapp.tls.certresolver=le"
      
      # INSTRUÇÃO PARA O TRAEFIK:
      # A imagem php:7.4-apache roda internamente na porta 80
      - "traefik.http.services.phpapp.loadbalancer.server.port=80"
      
    #command: >
    #  sh -c "docker-php-ext-install pdo pdo_mysql && apache2-foreground"
    #


networks: 
  jbjuaz:
    external: true

volumes:
  # Apenas volumes necessários que não são de desenvolvimento
  volume_db_data_jbjuaz:
    external: true
  volume_wsjbjuaz_fotos:
    external: true
  # Volumes de desenvolvimento removidos (usamos bind mounts locais)
  # volume_php_jbjuaz_app: - REMOVIDO
  # volume_wsjbjuaz: - REMOVIDO  
  # volume_jbjuaz: - REMOVIDO

